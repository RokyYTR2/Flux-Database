[package]
name = "fluxdb"
version = "26.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
clap = { version = "4.5.31", features = ["derive"] }
pbkdf2 = "0.12.2"
rand = "0.8.5"
rpassword = "7.3.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
thiserror = "2.0.12"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.18.0"

[[bench]]
name = "fluxdb_bench"
harness = false
